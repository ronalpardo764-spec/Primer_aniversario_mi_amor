<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Aniversario - Te amo Jhoselin</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030303;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
        }

        #screen-start {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #030303;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        .btn-start {
            background-color: #d32f2f;
            color: white;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(211, 47, 47, 0.9);
            animation: pulse 1.5s infinite;
            text-align: center;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(211, 47, 47, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(211, 47, 47, 1); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(211, 47, 47, 0.6); }
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Banner amarillo superior */
        .cuadro-amarillo {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffeb3b;
            color: #000;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            z-index: 50;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="screen-start" onclick="iniciarExperiencia()">
        <div class="btn-start">
            Primer aniversario que celebramos, te amo Jhoselin ❤️
        </div>
    </div>

    <div class="cuadro-amarillo">
        Eres mi universo y mi pasión eterna ✨
    </div>

    <div id="canvas-container"></div>

    <audio id="background-music" loop>
        <source src="cancion.mp3" type="audio/mp3">
    </audio>

    <script>
        let scene, camera, renderer, controls;
        let galaxyGroup;

        const mensajesNube = [
            "Te amo infinitamente", "Mi corazón te elige", "Eres mi sueño hecho realidad", "Te amo su sonrisa",
            "Mi corazón es tuyo", "Eres mi galaxia entera", "Te amaré por siempre", "Amor de mi vida",
            "Eres el amor de mi vida", "Eternamente tuyo", "Amo tu voz", "Amo cada detalle tuyo",
            "Mi único y verdadero amor", "Tus besos son mi adicción", "Me haces bien al alma", "Mi lugar seguro eres tú",
            "Siento mariposas contigo", "Te elijo hoy y siempre", "Mi corazón late fuerte por ti", "Contigo aprendí a amar",
            "No te cambio por nada", "Eres mi paz y mi refugio", "Mi dulce casualidad", "Por una eternidad a tu lado",
            "Cada latido es tuyo", "Eres mi sol", "Mi gran fortuna", "Te necesito en mi vida", "Amor verdadero",
            "Mi compañera perfecta", "Eres arte puro", "Mi gran tesoro", "Te pienso siempre", "Dueña de mi alma",
            "Mi destino eres tú", "Magia pura a tu lado", "Abrazo eterno", "Besos infinitos", "Mi otra mitad",
            "Juntos por la eternidad", "Te amo mi vida", "Primer aniversario", "Eres mi todo", "Mi gran amor",
            "Cada día más unidos", "Sueño contigo siempre", "Te adoro con el alma", "Mi dulce Jhoselin", "Luz de mis ojos"
        ];

        function crearTextoTexture(texto) {
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 80;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(10, 10, 10, 0.75)';
            ctx.strokeStyle = '#ff3366';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(5, 5, 310, 70, 18);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ff99aa';
            ctx.font = 'Bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(texto, 160, 40);

            return new THREE.CanvasTexture(canvas);
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.04;
            controls.rotateSpeed = 0.7;

            // Galaxia principal que rota suavemente
            galaxyGroup = new THREE.Group();
            scene.add(galaxyGroup);

            // Partículas de estrellas rojas y blancas en el fondo
            const particleCount = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorRed = new THREE.Color(0xff1744);
            const colorWhite = new THREE.Color(0xffffff);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 1400;
                positions[i + 1] = (Math.random() - 0.5) * 1400;
                positions[i + 2] = (Math.random() - 0.5) * 1400;

                const mixedColor = Math.random() > 0.4 ? colorRed : colorWhite;
                colors[i] = mixedColor.r;
                colors[i + 1] = mixedColor.g;
                colors[i + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 3,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            const particleSystem = new THREE.Points(geometry, material);
            galaxyGroup.add(particleSystem);

            // Cargar tus 4 fotos y distribuirlas flotando en el centro
            const textureLoader = new THREE.TextureLoader();
            const fotos = ['foto1.jpg', 'foto2.jpg', 'foto3.jpg', 'foto4.jpg'];
            
            fotos.forEach((fotoUrl, index) => {
                const angle = (index / fotos.length) * Math.PI * 2;
                const distance = 130;
                const x = Math.cos(angle) * distance;
                const z = Math.sin(angle) * distance;
                const y = (Math.random() - 0.5) * 60;

                textureLoader.load(fotoUrl, (texture) => {
                    const planeGeo = new THREE.PlaneGeometry(90, 110);
                    const planeMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                    const photoMesh = new THREE.Mesh(planeGeo, planeMat);
                    photoMesh.position.set(x, y, z);
                    galaxyGroup.add(photoMesh);
                });
            });

            // Distribuir más de 100 mensajes flotando en la nube esférica tridimensional
            for (let i = 0; i < 110; i++) {
                const msg = mensajesNube[i % mensajesNube.length];
                const textTex = crearTextoTexture(msg);
                const planeGeo = new THREE.PlaneGeometry(90, 24);
                const planeMat = new THREE.MeshBasicMaterial({ map: textTex, transparent: true, side: THREE.DoubleSide });
                
                const mesh = new THREE.Mesh(planeGeo, planeMat);

                // Posición aleatoria en esfera 3D alrededor del centro
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 180 + Math.random() * 220;

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);

                mesh.position.set(x, y, z);
                galaxyGroup.add(mesh);
            }

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotación suave y constante de toda la galaxia 3D
            if (galaxyGroup) {
                galaxyGroup.rotation.y += 0.002;
                galaxyGroup.rotation.x += 0.0008;

                // Hacer que todos los textos e imágenes siempre miren hacia la cámara
                galaxyGroup.children.forEach(child => {
                    if (child.type === "Mesh") {
                        child.lookAt(camera.position);
                    }
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function iniciarExperiencia() {
            const screenStart = document.getElementById('screen-start');
            const music = document.getElementById('background-music');

            music.play().catch(e => console.log("Audio bloqueado:", e));

            screenStart.style.opacity = '0';
            setTimeout(() => {
                screenStart.style.display = 'none';
                init3D();
            }, 1000);
        }
    </script>
</body>
</html>
