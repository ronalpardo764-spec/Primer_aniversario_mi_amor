<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Aniversario - Te amo Jhoselin</title>
    <!-- Carga de Three.js y OrbitControls para el movimiento 3D con el clic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030303;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
        }

        #screen-start {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #030303;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        .btn-start {
            background-color: #d32f2f;
            color: white;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(211, 47, 47, 0.9);
            animation: pulse 1.5s infinite;
            text-align: center;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(211, 47, 47, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(211, 47, 47, 1); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(211, 47, 47, 0.6); }
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Banner amarillo superior */
        .cuadro-amarillo {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffeb3b;
            color: #000;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            z-index: 50;
            text-align: center;
            pointer-events: none;
        }

        /* Corazón y mensaje central fijo */
        .universe-sun {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 40;
            pointer-events: none;
            animation: heartbeat 2s infinite;
        }

        .heart-shape {
            background-color: #ff1744;
            display: inline-block;
            height: 60px;
            margin: 0 10px;
            position: relative;
            transform: rotate(-45deg);
            width: 60px;
            box-shadow: 0 0 30px rgba(255, 23, 68, 0.9);
        }

        .heart-shape:before,
        .heart-shape:after {
            content: "";
            background-color: #ff1744;
            border-radius: 50%;
            height: 60px;
            position: absolute;
            width: 60px;
        }

        .heart-shape:before { top: -30px; left: 0; }
        .heart-shape:after { left: 30px; top: 0; }

        .sun-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
            white-space: nowrap;
            z-index: 45;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
        }

        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) scale(1); }
            30% { transform: translate(-50%, -50%) scale(1.1); }
            50% { transform: translate(-50%, -50%) scale(1); }
            70% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Indicador interactivo inferior */
        .instruction-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #ddd;
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="screen-start" onclick="iniciarExperiencia()">
        <div class="btn-start">
            Primer aniversario que celebramos, te amo Jhoselin ❤️
        </div>
    </div>

    <div class="cuadro-amarillo">
        Eres mi universo ✨
    </div>

    <div class="universe-sun">
        <div class="heart-shape"></div>
        <div class="sun-text">Te amo Jhoselin ❤️</div>
    </div>

    <div class="instruction-bar">
        🖱️ Haz clic y arrastra para rotar el universo en 3D
    </div>

    <div id="canvas-container"></div>

    <audio id="background-music" loop>
        <source src="cancion.mp3" type="audio/mp3">
    </audio>

    <script>
        let scene, camera, renderer, controls;
        let orbits = [];

        const listaMensajes = [
            "Te amo infinito", "Mi dulce amor", "Eres mi paz", "Ojos bellos", "Mi princesa", 
            "Por siempre juntos", "Contigo soy feliz", "Mi gran fortuna", "Te necesito hoy", "Amor verdadero", 
            "Mi compañera", "Eres arte puro", "Sonrisa hermosa", "Mi gran tesoro", "Te pienso siempre", 
            "Dueña de mi alma", "Mi destino eres tú", "Magia pura", "Abrazo eterno", "Besos infinitos", 
            "Mi otra mitad", "Juntos la eternidad", "Te amo mi vida", "Primer aniversario", "Eres mi todo", 
            "Mi gran amor", "Cada día más", "Sueño contigo", "Te adoro", "Mi dulce Jhoselin", 
            "Luz en mi vida", "Corazón mío", "Eres única", "Mi refugio", "Para siempre", 
            "Te amo sin fin", "Mi felicidad", "Nuestra historia", "Feliz aniversario", "Te amo muchísimo",
            "Te amo con locura", "Mi cielo entero", "Eres tan perfecta", "Dueña de mis días", "Amor de mi vida",
            "A tu lado todo es mejor", "Mi dulce tesoro", "Contigo hasta viejitos", "Te pienso a cada segundo", "Eres mi ilusión",
            "Mi razón de sonreír", "Ojos de mi vida", "Abrazarte es mi paz", "Besarte es tocar el cielo", "Mi hermosa casualidad",
            "Te amo hoy y siempre", "Eres mi bendición", "Mi compañera ideal", "Juntos contra el mundo", "Mi amor bonito",
            "Eres mi galaxia", "Tu sonrisa me eleva", "Mi latido favorito", "Te anhelo tanto", "Eres mi hogar",
            "Mi dulce paz", "Amor sin límites", "Mi mayor alegría", "Eres mi norte", "Contigo la vida brilla",
            "Mi princesa hermosa", "Te amo con el alma", "Eres mi paz mental", "Mi gran debilidad", "Sueño con tus besos",
            "Mi dulce compañía", "Eres mi poema", "Te amo sin condiciones", "Mi dulce refugio", "Eres mi gran anhelo",
            "Mi destino favorito", "Te amo eternamente", "Mi dulce estrella", "Eres mi paz y calma", "Mi dulce inspiración",
            "Te amo por siempre", "Mi gran bendición", "Eres mi sol", "Mi vida entera es tuya", "Feliz 1er aniversario"
        ];

        function crearTextoTexture(texto) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(20, 20, 20, 0.85)';
            ctx.strokeStyle = '#ff5252';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(10, 10, 236, 44, 15);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ff8a80';
            ctx.font = 'Bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(texto, 128, 32);

            return new THREE.CanvasTexture(canvas);
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, 450);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Permite rotar libremente el universo 3D al hacer clic y arrastrar
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.8;

            // Fondo de estrellas
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 1200;
            const starPositions = new Float32Array(starsCount * 3);
            for(let i=0; i<starsCount*3; i++) {
                starPositions[i] = (Math.random() - 0.5) * 1500;
            }
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5 });
            const starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);

            // Cargar imágenes
            const textureLoader = new THREE.TextureLoader();
            const fotos = ['foto1.jpg', 'foto2.jpg', 'foto3.jpg', 'foto4.jpg'];

            // Crear 4 Órbitas 3D con mensajes y fotos
            const radiors = [120, 200, 280, 360];
            const speeds = [0.015, -0.01, 0.007, -0.005];

            radiors.forEach((radius, idx) => {
                const orbitGroup = new THREE.Group();
                scene.add(orbitGroup);

                // Anillo visual de la órbita
                const ringGeo = new THREE.RingGeometry(radius - 0.5, radius + 0.5, 64);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.1 });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2;
                orbitGroup.add(ringMesh);

                // Agregar elementos a esta órbita
                let itemsCount = idx === 1 ? 12 : (idx === 0 ? 8 : 35);
                for(let i=0; i<itemsCount; i++) {
                    const angle = (i / itemsCount) * Math.PI * 2;
                    let mesh;

                    // En la órbita 2 colocamos las 4 fotos
                    if (idx === 1 && i % 3 === 0 && (i/3) < 4) {
                        const fotoIndex = Math.floor(i / 3);
                        const texture = textureLoader.load(fotos[fotoIndex]);
                        const geo = new THREE.PlaneGeometry(35, 35);
                        const mat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                        mesh = new THREE.Mesh(geo, mat);
                    } else {
                        // En las demás colocar los mensajes
                        const msg = listaMensajes[(idx * 20 + i) % listaMensajes.length];
                        const textTex = crearTextoTexture(msg);
                        const geo = new THREE.PlaneGeometry(40, 10);
                        const mat = new THREE.MeshBasicMaterial({ map: textTex, transparent: true, side: THREE.DoubleSide });
                        mesh = new THREE.Mesh(geo, mat);
                    }

                    mesh.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
                    orbitGroup.add(mesh);
                }

                orbits.push({ group: orbitGroup, speed: speeds[idx] });
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            orbits.forEach(orbit => {
                orbit.group.rotation.y += orbit.speed;
                // Orientar cada sprite hacia la cámara para lectura perfecta
                orbit.group.children.forEach(child => {
                    if (child.type === "Mesh" && child.geometry.type !== "RingGeometry") {
                        child.lookAt(camera.position);
                    }
                });
            });

            controls.update();
            renderer.render(scene, camera);
        }

        function iniciarExperiencia() {
            const screenStart = document.getElementById('screen-start');
            const music = document.getElementById('background-music');

            music.play().catch(e => console.log("Audio bloqueado:", e));

            screenStart.style.opacity = '0';
            setTimeout(() => {
                screenStart.style.display = 'none';
                init3D();
            }, 1000);
        }
    </script>
</body>
</html>
