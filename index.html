<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Aniversario - Te amo Jhoselin</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
        }

        #screen-start {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        .btn-start {
            background-color: #d32f2f;
            color: white;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.9);
            animation: pulse 1.5s infinite;
            text-align: center;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(211, 47, 47, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(211, 47, 47, 1); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(211, 47, 47, 0.6); }
        }

        #main-content {
            display: none;
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #150015 0%, #050505 100%);
        }

        .cuadro-amarillo {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffeb3b;
            color: #000;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            z-index: 50;
            text-align: center;
        }

        .universe-sun {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 40;
            animation: heartbeat 2s infinite;
        }

        .heart-shape {
            background-color: #ff1744;
            display: inline-block;
            height: 70px;
            margin: 0 10px;
            position: relative;
            transform: rotate(-45deg);
            width: 70px;
            box-shadow: 0 0 30px rgba(255, 23, 68, 0.9);
        }

        .heart-shape:before,
        .heart-shape:after {
            content: "";
            background-color: #ff1744;
            border-radius: 50%;
            height: 70px;
            position: absolute;
            width: 70px;
        }

        .heart-shape:before { top: -35px; left: 0; }
        .heart-shape:after { left: 35px; top: 0; }

        .sun-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
            white-space: nowrap;
            z-index: 45;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
        }

        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) scale(1); }
            30% { transform: translate(-50%, -50%) scale(1.1); }
            50% { transform: translate(-50%, -50%) scale(1); }
            70% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .orbit-system {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            z-index: 20;
        }

        .orbit-1 {
            width: 320px;
            height: 320px;
            margin: -160px 0 0 -160px;
            animation: rotateOrbit 20s linear infinite;
        }

        .orbit-2 {
            width: 580px;
            height: 580px;
            margin: -290px 0 0 -290px;
            animation: rotateOrbit 35s linear infinite reverse;
        }

        .orbit-ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }

        .planet {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
        }

        .p1 { transform: rotate(0deg) translate(160px) rotate(0deg); }
        .p2 { transform: rotate(90deg) translate(160px) rotate(-90deg); }
        .p3 { transform: rotate(180deg) translate(160px) rotate(-180deg); }
        .p4 { transform: rotate(270deg) translate(160px) rotate(-270deg); }

        .p5 { transform: rotate(30deg) translate(290px) rotate(-30deg); }
        .p6 { transform: rotate(120deg) translate(290px) rotate(-120deg); }
        .p7 { transform: rotate(210deg) translate(290px) rotate(-210deg); }
        .p8 { transform: rotate(300deg) translate(290px) rotate(-300deg); }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .floating-bubble {
            background: rgba(20, 20, 20, 0.85);
            border: 1.5px solid #ff5252;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #ff8a80;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(255, 82, 82, 0.4);
            animation: counterRotate 20s linear infinite;
        }

        .orbit-2 .floating-bubble {
            animation: counterRotateReverse 35s linear infinite;
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        @keyframes counterRotateReverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .orbit-photo-card {
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #ff1744;
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            width: 130px;
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.6);
            animation: counterRotateReverse 35s linear infinite;
        }

        .orbit-photo-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
        }

        .orbit-photo-card p {
            font-size: 0.7rem;
            margin: 4px 0 0 0;
            color: #ff8a80;
            font-weight: bold;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div id="screen-start" onclick="iniciarExperiencia()">
        <div class="btn-start">
            Primer aniversario que celebramos, te amo Jhoselin ❤️
        </div>
    </div>

    <div id="main-content">
        
        <div class="star" style="top: 10%; left: 20%; width: 2px; height: 2px;"></div>
        <div class="star" style="top: 25% ; left: 80%; width: 3px; height: 3px; animation-delay: 1s;"></div>
        <div class="star" style="top: 75%; left: 15%; width: 2px; height: 2px; animation-delay: 0.5s;"></div>
        <div class="star" style="top: 85%; left: 85%; width: 3px; height: 3px; animation-delay: 1.5s;"></div>
        <div class="star" style="top: 40%; left: 90%; width: 2px; height: 2px;"></div>
        <div class="star" style="top: 60%; left: 10%; width: 2px; height: 2px; animation-delay: 0.8s;"></div>

        <div class="cuadro-amarillo">
            Eres mi universo ✨
        </div>

        <div class="universe-sun">
            <div class="heart-shape"></div>
            <div class="sun-text">Te amo Jhoselin ❤️</div>
        </div>

        <div class="orbit-system orbit-1">
            <div class="orbit-ring"></div>
            <div class="planet p1"><div class="floating-bubble">💖 Mi lugar seguro</div></div>
            <div class="planet p2"><div class="floating-bubble">🌟 Magia a tu lado</div></div>
            <div class="planet p3"><div class="floating-bubble">🌹 Juntos por siempre</div></div>
            <div class="planet p4"><div class="floating-bubble">💫 Mi vida entera</div></div>
        </div>

        <div class="orbit-system orbit-2">
            <div class="orbit-ring"></div>
            <!-- Foto 1 (Prueba .jpeg o .JPG o .jpg automáticamente) -->
            <div class="planet p5">
                <div class="orbit-photo-card">
                    <img src="foto1.jpeg" onerror="this.onerror=null; this.src='foto1.JPG';" alt="Foto 1">
                    <p>Nuestro inicio</p>
                </div>
            </div>
            <!-- Foto 2 -->
            <div class="planet p6">
                <div class="orbit-photo-card">
                    <img src="foto2.jpeg" onerror="this.onerror=null; this.src='foto2.JPG';" alt="Foto 2">
                    <p>Tus sonrisas</p>
                </div>
            </div>
            <!-- Foto 3 -->
            <div class="planet p7">
                <div class="orbit-photo-card">
                    <img src="foto3.jpeg" onerror="this.onerror=null; this.src='foto3.JPG';" alt="Foto 3">
                    <p>Contigo todo</p>
                </div>
            </div>
            <!-- Foto 4 -->
            <div class="planet p8">
                <div class="orbit-photo-card">
                    <img src="foto4.jpeg" onerror="this.onerror=null; this.src='foto4.JPG';" alt="Foto 4">
                    <p>Por una eternidad</p>
                </div>
            </div>
        </div>

    </div>

    <audio id="background-music" loop>
        <source src="cancion.mp3" type="audio/mp3">
        Tu navegador no soporta audio.
    </audio>

    <script>
        function iniciarExperiencia() {
            var screenStart = document.getElementById('screen-start');
            var mainContent = document.getElementById('main-content');
            var music = document.getElementById('background-music');

            music.play().catch(error => {
                console.log("Audio bloqueado:", error);
            });

            screenStart.style.opacity = '0';
            setTimeout(function() {
                screenStart.style.display = 'none';
                mainContent.style.display = 'block';
            }, 1000);
        }
    </script>
</body>
</html>
